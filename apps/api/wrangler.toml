name = "wds-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "local-dev-placeholder"
localConnectionString = "postgres://webhooks:webhooks@localhost:5433/webhooks"

[[durable_objects.bindings]]
name = "DISPATCHER"
class_name = "Dispatcher"
script_name = "wds-dispatcher"