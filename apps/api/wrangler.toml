name = "wds-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "local-dev-placeholder"
localConnectionString = "postgres://webhooks:webhooks@localhost:5433/webhooks"

[[durable_objects.bindings]]
name = "DISPATCHER"
class_name = "Dispatcher"
script_name = "wds-dispatcher"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "EndpointLimiter"
script_name = "wds-limiter"

# The maintenance cron (src/maintenance.ts). It's on the API Worker because local dev can only
# trigger the first Worker's cron: curl "localhost:8787/__scheduled?cron=*/15+*+*+*+*".
[triggers]
crons = ["*/15 * * * *"]

[secrets]
required = ["MASTER_KEY_V1"]

[vars]
ALLOW_LOCAL_ENDPOINTS = "false"
# How many days rows are kept (parseRetention in core checks the rules). The spec's defaults are
# 7 / 30 / 30; events get 3 more days here, so a delivery redelivered on its last day can still
# read its event. The cloud deploy will use less: Neon Free has 0.5 GB.
ATTEMPT_RETENTION_DAYS = "7"
DELIVERY_RETENTION_DAYS = "30"
EVENT_RETENTION_DAYS = "33"
