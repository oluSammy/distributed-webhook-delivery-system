name = "wds-dispatcher"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "DISPATCHER"
class_name = "Dispatcher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Dispatcher"]

[[services]]
binding = "DELIVERY"
service = "wds-delivery"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "local-dev-placeholder"
localConnectionString = "postgres://webhooks:webhooks@localhost:5433/webhooks"

