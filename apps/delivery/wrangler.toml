name = "wds-delivery"
main = "src/index.ts"
compatibility_date = "2026-08-15"
# Fetch every URL over the public internet. Without this, calling our own test consumer
# (another Worker on this account's workers.dev) fails with Cloudflare error 1042.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "5f6b8a852102406492ee7658ee20bbaf"
localConnectionString = "postgres://webhooks:webhooks@localhost:5433/webhooks"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "EndpointLimiter"
script_name = "wds-limiter"

[secrets]
required = ["MASTER_KEY_V1"]

[vars]
ALLOW_LOCAL_ENDPOINTS = "false"
# Fault injection for pnpm chaos, off here so it's off in the cloud; .dev.vars turns it on locally.
FAULT_KILL_AFTER_SEND = "false"
FAULT_STALL_MS = "0"