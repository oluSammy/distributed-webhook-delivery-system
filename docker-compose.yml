name: wds # compose project name

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports:
      - "5433:5432" #  maps your Mac's port 5433 → the container's port 5432
    command: # starts postgres with extra settings sets one setting from postgresql.conf
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements # built in extension to load how long every query takes
      - -c
      - log_lock_waits=on # logs any query that waits on a lock for longer than deadlock_timeout
    shm_size: 256mb # docker gives 64mb of shared memory by default
    volumes:
      - pgdata:/var/lib/postgresql/18/data # stores the data in a named docker volume so the data survives docker compose down, docker compose down -v deletes it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 2s # checks every 2s wether docker is accepting connections
      timeout: 3s
      retries: 15

  # A connection pool in front of Postgres, standing in for Hyperdrive's pool during load tests.
  # Only started with the bench profile (pnpm dev:bench); pnpm dev leaves it off.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    profiles: [bench]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres # the postgres service above, on Compose's own network
      DB_PORT: 5432
      DB_USER: webhooks
      DB_PASSWORD: webhooks
      DB_NAME: webhooks
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction # a connection is lent for one transaction, as Hyperdrive does
      DEFAULT_POOL_SIZE: 40 # connections to Postgres, shared by every client
      MAX_CLIENT_CONN: 1000 # connections the Workers may open to the pool
      MAX_PREPARED_STATEMENTS: 500 # postgres.js prepares its queries; the pool tracks them per connection
    ports:
      - "6433:5432"

volumes:
  pgdata: